<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCQ concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="paper-ls-p1-2026.js"></script>
<style>
  :root { --bg:#191b1e; --panel:#202327; --field:#23262a; --line:#2a2e33; --line2:#363b41; --text:#eceded; --text2:#a4a9ae; --text3:#8f9499;
    --tint:#81b1ff; --ok:#3ddc97; --danger:#f2777a; --gold:#f5c451;
    --grad:linear-gradient(135deg,#0068f8 0%,#1e46ff 50%,#671dff 100%); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:"Sora", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body { min-height:100vh; background:radial-gradient(900px 500px at 50% -10%, rgba(56,57,255,0.16), transparent 70%), var(--bg); }
  .top { display:flex; align-items:center; gap:12px; padding:14px 18px; }
  .seg { flex:1; display:flex; gap:6px; } .seg i { flex:1; height:6px; border-radius:6px; background:var(--line2); }
  .seg i.on { background:var(--grad); }
  .xp { display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:12px; border:1px solid var(--line2); font-weight:700; font-size:14px; }
  .mute { width:40px; height:38px; border-radius:12px; border:1px solid var(--line2); background:transparent; color:var(--text2); font:inherit; font-size:15px; cursor:pointer; }
  .streak { font-size:12px; font-weight:700; color:var(--gold); min-width:74px; text-align:right; }
  .pick { display:flex; gap:6px; justify-content:center; margin:2px 0 10px; flex-wrap:wrap; padding:0 12px; }
  .pick button { font:inherit; font-size:12px; font-weight:700; color:var(--text2); background:var(--panel); border:1px solid var(--line2); border-radius:10px; padding:7px 11px; cursor:pointer; }
  .pick button[aria-pressed="true"] { color:#fff; border-color:#4a5cff; }
  .stage { max-width:760px; margin:0 auto; padding:6px 18px 150px; }
  .meta { display:flex; align-items:center; gap:10px; color:var(--text2); font-size:13px; font-weight:600; }
  .num { color:var(--tint); background:rgba(129,177,255,0.12); padding:3px 9px; border-radius:8px; font-weight:700; }
  .tries { margin-left:auto; display:flex; gap:5px; } .tries i { width:9px; height:9px; border-radius:50%; background:var(--line2); } .tries i.live { background:var(--tint); }
  h1 { font-size:22px; line-height:1.4; font-weight:700; margin:12px 0 20px; letter-spacing:-0.01em; }
  .hint { font-size:12.5px; color:var(--text3); margin:-10px 0 16px; }
  /* The cards: a front (the option) and a back (the why), dealt in, lifted once when picked */
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:14px; perspective:1100px; }
  @media (max-width:600px) { .tiles { grid-template-columns:1fr; } h1 { font-size:19px; } }
  .tile { position:relative; min-height:96px; transform-style:preserve-3d; transition:transform 420ms cubic-bezier(.2,.8,.2,1), opacity 260ms, filter 260ms; }
  .tile.sel { transform:translateY(-6px) translateZ(26px) scale(1.02); }
  .tile.flipped { transform:rotateY(180deg); }
  .side { position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .face { display:flex; gap:12px; align-items:flex-start; width:100%; height:100%; text-align:left; font:inherit; color:var(--text);
    padding:16px 16px 16px 14px; border:1px solid var(--line2); background:linear-gradient(180deg,#262a30,#1f2226); cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06); transition:box-shadow 240ms, border-color 240ms, background 240ms; }
  .face:focus-visible { outline:2px solid var(--tint); outline-offset:3px; }
  .letter { flex:none; width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;
    background:#2f343b; color:var(--text2); transition:background 240ms, color 240ms; }
  .txt { font-size:15px; line-height:1.45; font-weight:600; padding-top:5px; padding-right:30px; }
  .x { position:absolute; top:4px; right:4px; width:44px; height:44px; border:none; background:transparent; padding:8px; cursor:pointer; z-index:2; }
  .x span { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:9px; border:1px solid var(--line2); background:#23272c; color:var(--text3); font-size:13px; }
  .x:hover span { color:var(--text); } .x:focus-visible span { outline:2px solid var(--tint); }
  .go { position:absolute; right:12px; bottom:12px; z-index:2; font:inherit; font-size:13px; font-weight:800; color:#fff; border:none; border-radius:11px; padding:8px 13px;
    background:var(--grad); box-shadow:0 8px 20px rgba(38,50,255,0.45); cursor:pointer; opacity:0; transform:translateY(6px); pointer-events:none; transition:opacity 200ms, transform 200ms; }
  .tile.sel .go { opacity:1; transform:none; pointer-events:auto; }
  .tile.sel .face { border-color:transparent; background:linear-gradient(180deg,#27305a,#211f45);
    box-shadow:0 24px 48px rgba(38,50,255,0.38), 0 0 0 2px #4b5cff, inset 0 1px 0 rgba(255,255,255,0.12); }
  .tile.sel .letter { background:var(--grad); color:#fff; }
  .tile.out { opacity:0.36; filter:saturate(0.2); } .tile.out .txt { text-decoration:line-through; text-decoration-thickness:2px; } .tile.out .x span { color:var(--tint); }
  .back { transform:rotateY(180deg); padding:14px 16px; display:flex; flex-direction:column; gap:6px; justify-content:center;
    background:linear-gradient(180deg,#3a3016,#2a220d); box-shadow:0 22px 50px rgba(245,196,81,0.28), 0 0 0 2px var(--gold); }
  .back .ok { font-size:13px; font-weight:800; color:var(--gold); }
  .back .why { font-size:14px; line-height:1.45; font-weight:600; color:#f3ead2; }
  @keyframes deal { from { opacity:0; transform:translateY(70px) rotateX(-35deg) rotateZ(var(--rz)) scale(0.9); } to { opacity:1; transform:none; } }
  .tile.dealt { animation:deal 520ms cubic-bezier(.2,.9,.25,1.1) both; animation-delay:var(--d); }
  @keyframes crack { 0% { transform:translateZ(0) } 20% { transform:translateX(-7px) rotateZ(-2deg) } 40% { transform:translateX(6px) rotateZ(2deg) } 70% { transform:translateY(10px) rotateX(18deg) } 100% { transform:translateY(6px) rotateX(12deg) } }
  .tile.anim-wrong { animation:crack 520ms ease-out forwards; }
  .tile.wrong .face { border-color:rgba(242,119,122,0.6); }
  /* Dials and switches (the two native shapes) */
  .builder { display:grid; gap:12px; margin:0 0 18px; }
  .dial { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:var(--panel); border:1px solid var(--line); }
  .dial .lbl { width:110px; font-size:12px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; }
  .dial .opts { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font:inherit; font-size:14px; font-weight:700; padding:9px 14px; border-radius:12px; border:1px solid var(--line2); background:#262a2f; color:var(--text2); cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 8px 20px rgba(38,50,255,0.35); }
  .readout { font-size:13px; color:var(--text2); min-height:20px; margin-bottom:8px; } .readout b { color:var(--text); } .readout .no { color:var(--danger); }
  .switches { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:0 0 16px; }
  .sw { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border-radius:18px; background:var(--panel); border:1px solid var(--line); font:inherit; color:var(--text); cursor:pointer; text-align:left; }
  .sw .k { font-size:12px; color:var(--text3); font-weight:700; } .sw .v { font-size:16px; font-weight:700; margin-top:3px; }
  .sw .track { flex:none; width:54px; height:30px; border-radius:30px; background:#30353c; position:relative; transition:background 200ms; }
  .sw .track::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#cfd3d7; transition:left 220ms cubic-bezier(.2,.8,.2,1); }
  .sw[aria-checked="true"] { border-color:#4b5cff; } .sw[aria-checked="true"] .track { background:var(--grad); } .sw[aria-checked="true"] .track::after { left:27px; background:#fff; }
  /* The dock: what to do next, the clue, and Next */
  .dock { position:fixed; left:0; right:0; bottom:0; padding:14px 18px 20px; background:linear-gradient(0deg, var(--bg) 60%, rgba(25,27,30,0)); pointer-events:none; }
  .dock-in { max-width:760px; margin:0 auto; display:grid; gap:10px; pointer-events:auto; }
  .say { text-align:center; font-size:13px; font-weight:600; color:var(--text3); min-height:18px; }
  .clue { font-size:13.5px; line-height:1.5; color:#dfe6ff; background:rgba(56,57,255,0.14); border:1px solid rgba(92,110,255,0.35); border-radius:14px; padding:10px 14px; display:none; }
  .clue.show { display:block; }
  .next { font:inherit; font-size:16px; font-weight:800; color:#fff; border:none; border-radius:16px; height:56px; background:var(--grad); cursor:pointer; display:none; }
  .next.show { display:block; }
  .toast { position:fixed; left:50%; top:74px; transform:translate(-50%,-20px); opacity:0; padding:10px 16px; border-radius:14px; font-weight:800; font-size:14px; transition:all 260ms; pointer-events:none; z-index:10; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .toast.ok { background:rgba(61,220,151,0.15); color:var(--ok); border:1px solid rgba(61,220,151,0.4); }
  .toast.no { background:rgba(242,119,122,0.14); color:var(--danger); border:1px solid rgba(242,119,122,0.4); }
  .fly { position:fixed; font-weight:800; color:var(--gold); font-size:18px; pointer-events:none; transition:transform 900ms cubic-bezier(.3,.7,.2,1), opacity 900ms; z-index:9; }
  canvas#fx { position:fixed; inset:0; pointer-events:none; z-index:8; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .tile, .tile * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="top">
  <div class="seg" id="seg"></div>
  <div class="streak" id="streak"></div>
  <button class="mute" id="mute" aria-pressed="false" aria-label="Sound on" title="Sound">🔊</button>
  <div class="xp"><span aria-hidden="true">⚡</span><span id="xp">0</span><span style="color:var(--tint)">XP</span></div>
</div>
<div class="pick" role="group" aria-label="Concept question">
  <button data-q="1.1.1" aria-pressed="true">Classic · 1.1.1</button>
  <button data-q="1.1.5" aria-pressed="false">Two-part · 1.1.5</button>
  <button data-q="1.3.1" aria-pressed="false">A, B, both · 1.3.1</button>
</div>
<main class="stage" id="stage"></main>
<div class="dock"><div class="dock-in">
  <div class="clue" id="clue" role="status"></div>
  <div class="say" id="say"></div>
  <button class="next" id="next">Next question</button>
</div></div>
<div class="toast" id="toast" role="status"></div>
<p class="sr" id="live" aria-live="polite"></p>
<script>
const P = window.PAPER_LS_P1_2026, ITEMS = {};
P.sections.forEach(s => s.missions.forEach(m => m.items.forEach(it => ITEMS[it.n] = it)));
const XP_BY_TRY = [100, 60, 20, 0], L = "ABCDEFGH";
let S = null, xp = 0, streak = 0;
const $ = id => document.getElementById(id), live = t => { $("live").textContent = t; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Sound, made in the browser (no files): a tick on pick, a thunk on lock-in, a chime or a low buzz on the result.
let AC = null, muted = false;
function tone(freq, dur, type = "sine", vol = 0.08, glide = 0) {
  if (muted) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = type; o.frequency.setValueAtTime(freq, t);
  if (glide) o.frequency.exponentialRampToValueAtTime(freq * glide, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur); }
const sfx = { pick: () => tone(880, 0.07, "triangle", 0.05), lock: () => tone(180, 0.14, "sine", 0.12, 0.6),
  right: () => { tone(660, 0.18, "triangle", 0.07); setTimeout(() => tone(990, 0.28, "triangle", 0.07), 110); },
  wrong: () => tone(160, 0.3, "sawtooth", 0.035, 0.7), out: () => tone(420, 0.06, "square", 0.025) };
const buzz = ms => { if (!muted && navigator.vibrate) navigator.vibrate(ms); };   // Android browsers; iPhone Safari has no vibration API
$("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊"; $("mute").setAttribute("aria-pressed", String(muted)); $("mute").setAttribute("aria-label", muted ? "Sound off" : "Sound on"); };

// The shape of an MCQ, read from the paper's own text (never hand-set per question).
function shapeOf(it) {
  const parts = it.opts.map(o => o.replace(/\.$/, "").split(" · "));
  if (parts.every(p => p.length === parts[0].length) && parts[0].length >= 2) {
    const dials = parts[0].map((_, k) => [...new Set(parts.map(p => p[k]))]);
    if (dials.every(d => d.length >= 2)) return { kind: "dials", parts, dials };
  }
  if (it.opts.join("|") === "A only|B only|Both A and B|None") {
    const m = it.q.match(/A:\s*(.+?)\s*·\s*B:\s*(.+)$/);
    if (m) return { kind: "switches", a: m[1], b: m[2], stem: it.q.slice(0, m.index).trim().replace(/\.$/, "") };
  }
  return { kind: "classic" };
}

function load(n) {
  const it = ITEMS[n];
  S = { it, shape: shapeOf(it), sel: null, out: new Set(), tries: 0, done: false, dialSel: [], sw: [false, false] };
  document.querySelectorAll(".pick button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.q === n)));
  $("clue").classList.remove("show"); $("next").classList.remove("show");
  render(true);
}

function render(deal) {
  const { it, shape } = S, st = $("stage");
  const stem = shape.kind === "switches" ? shape.stem : it.q;
  st.innerHTML = `<div class="meta"><span class="num">${it.n}</span><span>${it.marks} marks</span><span class="tries"></span></div><h1>${stem}</h1>`;
  if (shape.kind === "dials") {
    st.insertAdjacentHTML("beforeend", `<p class="hint">Build the answer one part at a time. The option that matches lights up.</p><div class="builder" id="builder"></div><div class="readout" id="readout"></div>`);
    shape.dials.forEach((vals, k) => {
      const d = document.createElement("div"); d.className = "dial"; d.setAttribute("role", "group");
      d.innerHTML = `<span class="lbl">Part ${k + 1}</span><span class="opts">${vals.map(v => `<button class="chip" aria-pressed="false">${v}</button>`).join("")}</span>`;
      d.querySelectorAll(".chip").forEach((c, i) => c.onclick = () => { if (S.done) return; S.dialSel[k] = vals[i]; sfx.pick(); syncDials(); });
      $("builder").appendChild(d);
    });
  }
  if (shape.kind === "switches") {
    st.insertAdjacentHTML("beforeend", `<p class="hint">Switch on each one it applies to.</p><div class="switches">
      ${[shape.a, shape.b].map((v, k) => `<button class="sw" role="switch" aria-checked="false" data-k="${k}"><span><span class="k">${"AB"[k]}</span><div class="v">${v}</div></span><span class="track"></span></button>`).join("")}</div>`);
    st.querySelectorAll(".sw").forEach(b => b.onclick = () => { if (S.done) return; S.sw[+b.dataset.k] = !S.sw[+b.dataset.k]; sfx.pick(); syncSwitches(); });
  }
  const g = document.createElement("div"); g.className = "tiles"; g.setAttribute("role", "radiogroup"); g.setAttribute("aria-label", "Options");
  it.opts.forEach((o, i) => {
    const t = document.createElement("div"); t.className = "tile" + (deal && !reduced ? " dealt" : ""); t.dataset.i = i;
    t.style.setProperty("--d", (i * 90) + "ms"); t.style.setProperty("--rz", ((i % 2 ? 1 : -1) * (4 + i)) + "deg");
    t.innerHTML = `<button class="side face" role="radio" aria-checked="false"><span class="letter">${L[i]}</span><span class="txt">${o}</span></button>
      <div class="side back" aria-hidden="true"><div class="ok"></div><div class="why"></div></div>
      <button class="x" aria-label="Cross out ${L[i]}" title="Cross out"><span>✕</span></button>
      <button class="go" aria-label="Lock in ${L[i]}">Lock in</button>`;
    t.querySelector(".face").onclick = () => press(i);
    t.querySelector(".x").onclick = e => { e.stopPropagation(); toggleOut(i); };
    t.querySelector(".go").onclick = e => { e.stopPropagation(); if (S.sel === i) submit(); };
    t.addEventListener("animationend", ev => { if (ev.animationName === "deal") t.classList.remove("dealt"); });
    swipeOut(t, i); g.appendChild(t);
  });
  st.appendChild(g); paintTiles(); paintTop(); say();
}

// Pick, then pick again (or Lock in) to answer: two deliberate taps on the card itself, never a separate hold.
function press(i) {
  if (S.done || S.out.has(i)) return;
  if (S.sel === i) { submit(); return; }                                          // the same second tap answers, on every shape
  S.sel = i; sfx.pick();
  if (S.shape.kind === "switches") { S.sw = [i === 0 || i === 2, i === 1 || i === 2]; syncSwitches(); return; }
  if (S.shape.kind === "dials") { S.dialSel = [...S.shape.parts[i]]; syncDials(); return; }
  paintTiles(); say(); live(`${L[i]} picked. Tap it again, or Lock in, to answer.`);
}
function syncDials() {
  const { shape } = S; document.querySelectorAll(".dial").forEach((d, k) => d.querySelectorAll(".chip").forEach((c, i) => c.setAttribute("aria-pressed", String(shape.dials[k][i] === S.dialSel[k]))));
  const full = shape.dials.every((_, k) => S.dialSel[k]);
  const idx = full ? shape.parts.findIndex(p => p.every((v, k) => v === S.dialSel[k])) : -1;
  $("readout").innerHTML = !full ? "" : idx < 0 ? `<span class="no">That combination isn't one of the paper's options. Change a part.</span>` : `Matches option <b>${L[idx]}</b>.`;
  S.sel = idx >= 0 && !S.out.has(idx) ? idx : null; paintTiles(); say();
}
function syncSwitches() {
  document.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-checked", String(S.sw[+b.dataset.k])));
  const [a, b] = S.sw; const idx = a && b ? 2 : a ? 0 : b ? 1 : 3; S.sel = S.out.has(idx) ? null : idx; paintTiles(); say();
}
function toggleOut(i) { if (S.done) return; S.out.has(i) ? S.out.delete(i) : S.out.add(i); if (S.sel === i) S.sel = null; sfx.out(); paintTiles(); say();
  live(S.out.has(i) ? `${L[i]} crossed out` : `${L[i]} back in`); }
function paintTiles() { document.querySelectorAll(".tile").forEach(t => { const i = +t.dataset.i, on = S.sel === i && !S.done;
  t.classList.toggle("sel", on); t.classList.toggle("out", S.out.has(i)); t.querySelector(".face").setAttribute("aria-checked", String(S.sel === i)); }); }
function say() { $("say").textContent = S.done ? "" : S.sel == null ? (S.out.size ? "Cross out what it can't be, then pick" : "Pick an answer") : `Tap ${L[S.sel]} again, or Lock in, to answer`; }
function paintTop() { $("seg").innerHTML = Array.from({ length: 9 }, (_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join(""); $("xp").textContent = xp;
  $("streak").textContent = streak >= 2 ? `${streak} in a row` : "";
  const tr = document.querySelector(".tries"), left = Math.max(0, 3 - S.tries);
  if (tr) { tr.innerHTML = [0, 1, 2].map(i => `<i class="${i >= S.tries ? "live" : ""}"></i>`).join(""); tr.setAttribute("aria-label", `${left} ${left === 1 ? "try" : "tries"} left`); } }
document.addEventListener("keydown", e => { if (!S || S.done) { if (e.key === "Enter" && S && S.done) next(); return; }
  const i = "abcd".indexOf(e.key.toLowerCase()); if (i >= 0 && i < S.it.opts.length && !e.metaKey && !e.ctrlKey) { press(i); return; }
  // Enter answers only from the page or a card's face; on any other button (cross out, a dial, a switch) it does that button's job.
  const a = document.activeElement;
  if (e.key === "Enter" && S.sel != null && (a === document.body || a?.classList?.contains("face"))) { e.preventDefault(); submit(); } });

function submit() {
  const i = S.sel; if (i == null || S.done) return;
  const t = document.querySelector(`.tile[data-i="${i}"]`), ok = i === S.it.a; S.tries++; sfx.lock(); buzz(18);
  if (ok) {
    S.done = true; const gain = XP_BY_TRY[S.tries - 1]; xp += gain; streak = S.tries === 1 ? streak + 1 : 0;
    t.querySelector(".ok").textContent = (S.tries === 1 ? "First try" : "Correct") + " · +" + gain + " XP";
    t.querySelector(".why").textContent = "Why · " + (S.it.clues[0] || "");
    t.querySelector(".back").removeAttribute("aria-hidden");
    t.classList.remove("sel"); setTimeout(() => { t.classList.add("flipped"); sfx.right(); buzz([20, 40, 30]); burst(t); flyXP(t, gain); }, reduced ? 0 : 140);
    toast(S.tries === 1 ? "First try · +" + gain + " XP" : "Got it · +" + gain + " XP", "ok");
    live(`Correct, ${L[i]}. Plus ${gain} XP. Why: ${S.it.clues[0] || ""}`);
    $("next").classList.add("show"); $("clue").classList.remove("show");
  } else {
    streak = 0; t.classList.add("wrong"); if (!reduced) t.classList.add("anim-wrong"); sfx.wrong(); buzz([60, 40, 60]);
    setTimeout(() => { t.classList.remove("anim-wrong", "wrong"); S.out.add(i); S.sel = null; paintTiles(); say(); }, reduced ? 0 : 540);
    const clue = S.it.clues[Math.min(S.tries - 1, S.it.clues.length - 1)];
    if (S.tries >= 3) { S.done = true; toast("Answer: " + L[S.it.a], "no"); const r = document.querySelector(`.tile[data-i="${S.it.a}"]`);
      r.querySelector(".ok").textContent = "The answer"; r.querySelector(".why").textContent = "Why · " + (S.it.clues[0] || ""); setTimeout(() => r.classList.add("flipped"), 600); $("next").classList.add("show"); }
    else { toast("Not that one · " + (3 - S.tries) + " left", "no"); $("clue").textContent = "Clue · " + clue; $("clue").classList.add("show"); }

function next() { const order = ["1.1.1", "1.1.5", "1.3.1"]; load(order[(order.indexOf(S.it.n) + 1) % order.length]); }
$("next").onclick = next;
function toast(t, k) { const e = $("toast"); e.textContent = t; e.className = "toast show " + k; clearTimeout(e._t); e._t = setTimeout(() => e.className = "toast " + k, 1500); }
function swipeOut(t, i) { let y0 = null; t.addEventListener("touchstart", e => y0 = e.touches[0].clientY, { passive: true });
  t.addEventListener("touchend", e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 60) toggleOut(i); y0 = null; }); }

// The reward: a gold burst from the card and the XP flying to the counter.
const fx = $("fx"), cx = fx.getContext("2d"); let parts = [];

function burst(t) { if (reduced) return; const r = t.getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height / 2, start = !parts.length;
  for (let k = 0; k < 46; k++) { const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5; parts.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, c: ["#f5c451", "#00b5ff", "#8911ff", "#ffffff"][k % 4] }); }
  if (start) requestAnimationFrame(loop); }

  parts = parts.filter(p => p.life > 0); cx.globalAlpha = 1; if (parts.length) requestAnimationFrame(loop); }

  e.style.left = (r.left + r.width / 2) + "px"; e.style.top = (r.top) + "px"; document.body.appendChild(e);
  requestAnimationFrame(() => { e.style.transform = `translate(${to.left - r.left - r.width / 2}px, ${to.top - r.top}px) scale(0.7)`; e.style.opacity = "0.2"; });
  setTimeout(() => e.remove(), 950); }
