<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCQ concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="paper-ls-p1-2026.js"></script>
<style>
  :root { --bg:#15171a; --panel:#202327; --line:#2a2e33; --line2:#363b41; --text:#eceded; --text2:#a4a9ae; --text3:#8f9499;
    --tint:#81b1ff; --ok:#3ddc97; --danger:#f2777a; --gold:#f5c451;
    --grad:linear-gradient(135deg,#0068f8 0%,#1e46ff 50%,#671dff 100%); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:"Sora", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body { min-height:100vh; overflow-x:hidden; }
  /* The light behind the glass: slow colour so the panes have something to bend */
  .aura { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .aura i { position:absolute; width:46vmax; height:46vmax; border-radius:50%; filter:blur(70px); opacity:0.5; animation:drift 18s ease-in-out infinite alternate; }
  .aura i:nth-child(1) { left:-10vmax; top:10vh; background:#1e46ff; }
  .aura i:nth-child(2) { right:-12vmax; top:25vh; background:#671dff; animation-duration:22s; animation-delay:-6s; }
  .aura i:nth-child(3) { left:30vw; bottom:-24vmax; background:#00b5ff; opacity:0.28; animation-duration:26s; }
  @keyframes drift { from { transform:translate(0,0) scale(1); } to { transform:translate(6vmax,-4vmax) scale(1.12); } }
  .top, .pick, .stage, .dock { position:relative; z-index:1; }
  .top { display:flex; align-items:center; gap:12px; padding:14px 18px; }
  .seg { flex:1; display:flex; gap:6px; } .seg i { flex:1; height:6px; border-radius:6px; background:rgba(255,255,255,0.12); } .seg i.on { background:var(--grad); }
  .xp, .mute { display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:12px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.04); font-weight:700; font-size:14px; color:var(--text); }
  .mute { width:40px; height:38px; justify-content:center; font:inherit; cursor:pointer; padding:0; }
  .streak { font-size:12px; font-weight:700; color:var(--gold); min-width:74px; text-align:right; }
  .pick { display:flex; gap:6px; justify-content:center; margin:2px 0 10px; flex-wrap:wrap; padding:0 12px; }
  .pick button { font:inherit; font-size:12px; font-weight:700; color:var(--text2); background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:7px 11px; cursor:pointer; }
  .pick button[aria-pressed="true"] { color:#fff; border-color:#6a78ff; }
  .stage { max-width:760px; margin:0 auto; padding:6px 18px 150px; }
  .meta { display:flex; align-items:center; gap:10px; color:var(--text2); font-size:13px; font-weight:600; }
  .num { color:var(--tint); background:rgba(129,177,255,0.14); padding:3px 9px; border-radius:8px; font-weight:700; }
  .tries { margin-left:auto; display:flex; gap:5px; } .tries i { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.14); } .tries i.live { background:var(--tint); }
  h1 { font-size:22px; line-height:1.4; font-weight:700; margin:12px 0 20px; letter-spacing:-0.01em; }
  .hint { font-size:12.5px; color:var(--text3); margin:-10px 0 16px; }
  /* Glass cards: a front (the option) and a back (the why) */
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:14px; perspective:1100px; }
  @media (max-width:600px) { .tiles { grid-template-columns:1fr; } h1 { font-size:19px; } }
  .tile { position:relative; min-height:96px; transform-style:preserve-3d; transition:transform 420ms cubic-bezier(.2,.8,.2,1), opacity 260ms; }
  .tile.sel { transform:translateY(-6px) translateZ(26px) scale(1.02); }
  .tile.flipped { transform:rotateY(180deg); }
  .side { position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .glass { background:linear-gradient(145deg, rgba(255,255,255,0.13), rgba(255,255,255,0.035) 55%, rgba(255,255,255,0.07));
    border:1px solid rgba(255,255,255,0.16); box-shadow:0 14px 34px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.28), inset 0 -1px 0 rgba(255,255,255,0.05);
    -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%); }
  .face { display:flex; gap:12px; align-items:flex-start; width:100%; height:100%; text-align:left; font:inherit; color:var(--text); padding:16px 16px 16px 14px; cursor:pointer; overflow:hidden;
    transition:box-shadow 240ms, border-color 240ms, background 240ms; }
  .face::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.16) 45%, transparent 58%); transform:translateX(-120%); transition:transform 700ms ease; }
  .face:hover::after, .tile.sel .face::after { transform:translateX(120%); }
  .face:focus-visible { outline:2px solid var(--tint); outline-offset:3px; }
  .letter { flex:none; width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;
    background:rgba(255,255,255,0.1); color:var(--text); border:1px solid rgba(255,255,255,0.14); transition:background 240ms; }
  .txt { font-size:15px; line-height:1.45; font-weight:600; padding-top:5px; padding-right:30px; text-shadow:0 1px 2px rgba(0,0,0,0.35); }
  .x { position:absolute; top:4px; right:4px; width:44px; height:44px; border:none; background:transparent; padding:8px; cursor:pointer; z-index:2; }
  .x span { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:9px; border:1px solid rgba(255,255,255,0.18); background:rgba(0,0,0,0.18); color:var(--text2); font-size:13px; }
  .x:hover span { color:#fff; } .x:focus-visible span { outline:2px solid var(--tint); }
  .tile.sel .face { border-color:rgba(140,160,255,0.75); background:linear-gradient(145deg, rgba(90,110,255,0.34), rgba(103,29,255,0.16) 60%, rgba(0,181,255,0.14));
    box-shadow:0 26px 52px rgba(38,50,255,0.4), 0 0 0 1px rgba(140,160,255,0.55), inset 0 1px 0 rgba(255,255,255,0.38); }
  .tile.sel .letter { background:var(--grad); border-color:transparent; }
  /* Crossed out: the glass frosts over (reversible), it doesn't break */
  .tile.out .face { background:rgba(210,220,235,0.1); -webkit-backdrop-filter:blur(4px) saturate(40%); backdrop-filter:blur(4px) saturate(40%); }
  .tile.out .txt, .tile.out .letter { opacity:0.4; } .tile.out .txt { text-decoration:line-through; text-decoration-thickness:2px; } .tile.out .x span { color:var(--tint); }
  .back { transform:rotateY(180deg); padding:14px 16px; display:flex; flex-direction:column; gap:6px; justify-content:center; border:1px solid rgba(245,196,81,0.7);
    background:linear-gradient(145deg, rgba(245,196,81,0.3), rgba(160,110,20,0.2)); box-shadow:0 22px 50px rgba(245,196,81,0.3), inset 0 1px 0 rgba(255,240,200,0.5);
    -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%); }
  .back .ok { font-size:13px; font-weight:800; color:var(--gold); }
  .back .why { font-size:14px; line-height:1.45; font-weight:600; color:#fbf1d6; }
  @keyframes deal { from { opacity:0; transform:translateY(70px) rotateX(-35deg) rotateZ(var(--rz)) scale(0.9); } to { opacity:1; transform:none; } }
  .tile.dealt { animation:deal 520ms cubic-bezier(.2,.9,.25,1.1) both; animation-delay:var(--d); }
  /* The break: cracks drawn on the card, then shards on their own layer */
  .cracks { position:absolute; inset:0; z-index:3; pointer-events:none; overflow:visible; }
  .cracks path { fill:none; stroke:#ffffff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 3px rgba(190,210,255,1)) drop-shadow(0 0 1px #ffffff); }
  .cracks path.fine { stroke-width:1.1; stroke:rgba(255,255,255,0.8); }
  .impact { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; pointer-events:none; z-index:3;
    background:radial-gradient(closest-side, rgba(255,255,255,0.95), rgba(200,215,255,0.35) 45%, rgba(255,255,255,0) 100%); }
  .shards { position:fixed; inset:0; z-index:20; pointer-events:none; perspective:900px; }
  .shard { position:fixed; margin:0; border-radius:18px; background:linear-gradient(145deg, rgba(220,230,255,0.24), rgba(255,255,255,0.06));
    border:1px solid rgba(255,255,255,0.3); box-shadow:inset 0 1px 0 rgba(255,255,255,0.4); -webkit-backdrop-filter:none; backdrop-filter:none; will-change:transform, opacity; }
  /* Dials and switches */
  .builder { display:grid; gap:12px; margin:0 0 18px; }
  .dial { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; }
  .dial .lbl { width:110px; font-size:12px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.06em; }
  .dial .opts { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font:inherit; font-size:14px; font-weight:700; padding:9px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.05); color:var(--text2); cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--grad); color:#fff; border-color:transparent; box-shadow:0 8px 20px rgba(38,50,255,0.35); }
  .readout { font-size:13px; color:var(--text2); min-height:20px; margin-bottom:8px; } .readout b { color:var(--text); } .readout .no { color:var(--danger); }
  .switches { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:0 0 16px; }
  .sw { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border-radius:18px; font:inherit; color:var(--text); cursor:pointer; text-align:left; }
  .sw .k { font-size:12px; color:var(--text3); font-weight:700; } .sw .v { font-size:16px; font-weight:700; margin-top:3px; }
  .sw .track { flex:none; width:54px; height:30px; border-radius:30px; background:rgba(255,255,255,0.14); position:relative; transition:background 200ms; }
  .sw .track::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#cfd3d7; transition:left 220ms cubic-bezier(.2,.8,.2,1); }
  .sw[aria-checked="true"] { border-color:#6a78ff; } .sw[aria-checked="true"] .track { background:var(--grad); } .sw[aria-checked="true"] .track::after { left:27px; background:#fff; }
  /* The dock */
  .dock { position:fixed; left:0; right:0; bottom:0; padding:14px 18px 20px; background:linear-gradient(0deg, var(--bg) 55%, rgba(21,23,26,0)); pointer-events:none; }
  .dock-in { max-width:760px; margin:0 auto; display:grid; gap:10px; pointer-events:auto; }
  .say { text-align:center; font-size:13px; font-weight:600; color:var(--text3); min-height:18px; }
  .clue { font-size:13.5px; line-height:1.5; color:#dfe6ff; border-radius:14px; padding:10px 14px; display:none; }
  .clue.show { display:block; animation:rise 220ms cubic-bezier(.2,.8,.2,1); }
  .hint { justify-self:center; display:none; align-items:center; gap:6px; min-height:40px; padding:0 14px 0 11px; border-radius:999px; font:inherit; font-size:13px; font-weight:800;
    color:var(--tint); cursor:pointer; }
  .hint.show { display:inline-flex; } .hint svg { width:16px; height:16px; } .hint:focus-visible { outline:2px solid var(--tint); outline-offset:3px; }
  .hint[aria-expanded="true"] { color:#fff; border-color:rgba(140,160,255,0.6); }
  .hint.new { animation:nudge 1.1s ease 2; }
  @keyframes nudge { 0%, 100% { box-shadow:0 0 0 0 rgba(129,177,255,0); } 40% { box-shadow:0 0 0 7px rgba(129,177,255,0.22); } }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .next { font:inherit; font-size:16px; font-weight:800; color:#fff; border:none; border-radius:16px; height:56px; background:var(--grad); cursor:pointer; display:none; }
  .next.show { display:block; }
  .toast { position:fixed; left:50%; top:74px; transform:translate(-50%,-20px); opacity:0; padding:10px 16px; border-radius:14px; font-weight:800; font-size:14px; transition:all 260ms; pointer-events:none; z-index:30; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  .toast.ok { background:rgba(61,220,151,0.15); color:var(--ok); border:1px solid rgba(61,220,151,0.4); }
  .toast.no { background:rgba(242,119,122,0.14); color:var(--danger); border:1px solid rgba(242,119,122,0.4); }
  .fly { position:fixed; font-weight:800; color:var(--gold); font-size:18px; pointer-events:none; transition:transform 900ms cubic-bezier(.3,.7,.2,1), opacity 900ms; z-index:31; }
  canvas#fx { position:fixed; inset:0; pointer-events:none; z-index:25; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .tile, .tile *, .aura i { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>
<div class="shards" id="shards" aria-hidden="true"></div>
<div class="top">
  <div class="seg" id="seg"></div>
  <div class="streak" id="streak"></div>
  <button class="mute" id="mute" aria-pressed="false" aria-label="Sound on" title="Sound">🔊</button>
  <div class="xp"><span aria-hidden="true">⚡</span><span id="xp">0</span><span style="color:var(--tint)">XP</span></div>
</div>
<div class="pick" role="group" aria-label="Concept question">
  <button data-q="1.1.1" aria-pressed="true">Classic · 1.1.1</button>
  <button data-q="1.1.5" aria-pressed="false">Two-part · 1.1.5</button>
  <button data-q="1.3.1" aria-pressed="false">A, B, both · 1.3.1</button>
</div>
<main class="stage" id="stage"></main>
<div class="dock"><div class="dock-in">
  <div class="clue glass" id="clue"></div>
  <button class="hint glass" id="hint" aria-expanded="false" aria-controls="clue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span>Hint</span></button>
  <div class="say" id="say"></div>
  <button class="next" id="next">Next question</button>
</div></div>
<div class="toast" id="toast" role="status"></div>
<p class="sr" id="live" aria-live="polite"></p>
<script>
const P = window.PAPER_LS_P1_2026, ITEMS = {};
P.sections.forEach(s => s.missions.forEach(m => m.items.forEach(it => ITEMS[it.n] = it)));
const XP_BY_TRY = [100, 60, 20, 0], L = "ABCDEFGH";
let S = null, xp = 0, streak = 0;
const $ = id => document.getElementById(id), live = t => { $("live").textContent = t; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rnd = (a, b) => a + Math.random() * (b - a);

// Sound, made in the browser (no files).
let AC = null, muted = false;
const ac = () => { if (muted) return null; try { return AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } };
function tone(freq, dur, type = "sine", vol = 0.08, glide = 0, at = 0) { const A = ac(); if (!A) return;
  const o = A.createOscillator(), g = A.createGain(), t = A.currentTime + at; o.type = type; o.frequency.setValueAtTime(freq, t);
  if (glide) o.frequency.exponentialRampToValueAtTime(freq * glide, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(A.destination); o.start(t); o.stop(t + dur); }
function noise(dur, vol, hp, at = 0) { const A = ac(); if (!A) return; const n = Math.floor(A.sampleRate * dur), b = A.createBuffer(1, n, A.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = A.createBufferSource(), f = A.createBiquadFilter(), g = A.createGain(), t = A.currentTime + at; s.buffer = b; f.type = "highpass"; f.frequency.value = hp; g.gain.value = vol;
  s.connect(f).connect(g).connect(A.destination); s.start(t); }
const sfx = { pick: () => tone(880, 0.07, "triangle", 0.05), lock: () => tone(180, 0.14, "sine", 0.12, 0.6),
  right: () => { tone(660, 0.18, "triangle", 0.07); tone(990, 0.28, "triangle", 0.07, 0, 0.11); },
  crack: () => { noise(0.08, 0.35, 2500); tone(2400, 0.05, "square", 0.02); },
  shatter: () => { noise(0.45, 0.5, 1800); [3100, 4200, 5300, 3700, 4800].forEach((f, k) => tone(f, 0.16, "sine", 0.025, 0.9, 0.02 + k * 0.035)); },
  out: () => tone(420, 0.06, "square", 0.025) };
const buzz = ms => { if (!muted && navigator.vibrate) navigator.vibrate(ms); };
$("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "🔇" : "🔊"; $("mute").setAttribute("aria-pressed", String(muted)); $("mute").setAttribute("aria-label", muted ? "Sound off" : "Sound on"); };

function shapeOf(it) {
  const parts = it.opts.map(o => o.replace(/\.$/, "").split(" · "));
  if (parts.every(p => p.length === parts[0].length) && parts[0].length >= 2) {
    const dials = parts[0].map((_, k) => [...new Set(parts.map(p => p[k]))]);
    if (dials.every(d => d.length >= 2)) return { kind: "dials", parts, dials };
  }
  if (it.opts.join("|") === "A only|B only|Both A and B|None") {
    const m = it.q.match(/A:\s*(.+?)\s*·\s*B:\s*(.+)$/);
    if (m) return { kind: "switches", a: m[1], b: m[2], stem: it.q.slice(0, m.index).trim().replace(/\.$/, "") };
  }
  return { kind: "classic" };
}

function load(n) {
  const it = ITEMS[n];
  S = { it, shape: shapeOf(it), sel: null, out: new Set(), gone: new Set(), tries: 0, done: false, dialSel: [], sw: [false, false], hit: {} };
  document.querySelectorAll(".pick button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.q === n)));
  setHint(null); $("next").classList.remove("show");
  render(true);
}

function render(deal) {
  const { it, shape } = S, st = $("stage");
  const stem = shape.kind === "switches" ? shape.stem : it.q;
  st.innerHTML = `<div class="meta"><span class="num">${it.n}</span><span>${it.marks} marks</span><span class="tries"></span></div><h1>${stem}</h1>`;
  if (shape.kind === "dials") {
    st.insertAdjacentHTML("beforeend", `<p class="hint">Build the answer one part at a time. The option that matches lights up.</p><div class="builder" id="builder"></div><div class="readout" id="readout"></div>`);
    shape.dials.forEach((vals, k) => {
      const d = document.createElement("div"); d.className = "dial glass"; d.setAttribute("role", "group");
      d.innerHTML = `<span class="lbl">Part ${k + 1}</span><span class="opts">${vals.map(v => `<button class="chip" aria-pressed="false">${v}</button>`).join("")}</span>`;
      d.querySelectorAll(".chip").forEach((c, i) => c.onclick = () => { if (S.done) return; S.dialSel[k] = vals[i]; sfx.pick(); syncDials(); });
      $("builder").appendChild(d);
    });
  }
  if (shape.kind === "switches") {
    st.insertAdjacentHTML("beforeend", `<p class="hint">Switch on each one it applies to.</p><div class="switches">
      ${[shape.a, shape.b].map((v, k) => `<button class="sw glass" role="switch" aria-checked="false" data-k="${k}"><span><span class="k">${"AB"[k]}</span><div class="v">${v}</div></span><span class="track"></span></button>`).join("")}</div>`);
    st.querySelectorAll(".sw").forEach(b => b.onclick = () => { if (S.done) return; S.sw[+b.dataset.k] = !S.sw[+b.dataset.k]; sfx.pick(); syncSwitches(); });
  }
  const g = document.createElement("div"); g.className = "tiles"; g.id = "tiles"; g.setAttribute("role", "radiogroup"); g.setAttribute("aria-label", "Options");
  it.opts.forEach((o, i) => {
    const t = document.createElement("div"); t.className = "tile" + (deal && !reduced ? " dealt" : ""); t.dataset.i = i;
    t.style.setProperty("--d", (i * 90) + "ms"); t.style.setProperty("--rz", ((i % 2 ? 1 : -1) * (4 + i)) + "deg");
    t.innerHTML = `<button class="side face glass" role="radio" aria-checked="false"><span class="letter">${L[i]}</span><span class="txt">${o}</span></button>
      <div class="side back" aria-hidden="true"><div class="ok"></div><div class="why"></div></div>
      <button class="x" aria-label="Cross out ${L[i]}" title="Cross out"><span>✕</span></button>`;
    const face = t.querySelector(".face");
    face.addEventListener("pointerdown", e => { const r = face.getBoundingClientRect(); S.hit[i] = { x: e.clientX - r.left, y: e.clientY - r.top }; });
    face.onclick = () => press(i);
    t.querySelector(".x").onclick = e => { e.stopPropagation(); toggleOut(i); };
    t.addEventListener("animationend", ev => { if (ev.animationName === "deal") t.classList.remove("dealt"); });
    swipeOut(t, i); g.appendChild(t);
  });
  st.appendChild(g); paintTiles(); paintTop(); say();
}

function press(i) {
  if (S.done || S.out.has(i) || S.gone.has(i)) return;
  if (S.sel === i) { submit(); return; }
  S.sel = i; sfx.pick();
  if (S.shape.kind === "switches") { S.sw = [i === 0 || i === 2, i === 1 || i === 2]; syncSwitches(); return; }
  if (S.shape.kind === "dials") { S.dialSel = [...S.shape.parts[i]]; syncDials(); return; }
  paintTiles(); say(); live(`${L[i]} picked. Tap it again to answer.`);
}
function syncDials() {
  const { shape } = S; document.querySelectorAll(".dial").forEach((d, k) => d.querySelectorAll(".chip").forEach((c, i) => c.setAttribute("aria-pressed", String(shape.dials[k][i] === S.dialSel[k]))));
  const full = shape.dials.every((_, k) => S.dialSel[k]);
  const idx = full ? shape.parts.findIndex(p => p.every((v, k) => v === S.dialSel[k])) : -1;
  $("readout").innerHTML = !full ? "" : idx < 0 ? `<span class="no">That combination isn't one of the paper's options. Change a part.</span>`
    : S.gone.has(idx) ? `<span class="no">That was option ${L[idx]}, already ruled out.</span>` : `Matches option <b>${L[idx]}</b>.`;
  S.sel = idx >= 0 && !S.out.has(idx) && !S.gone.has(idx) ? idx : null; paintTiles(); say();
}
function syncSwitches() {
  document.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-checked", String(S.sw[+b.dataset.k])));
  const [a, b] = S.sw; const idx = a && b ? 2 : a ? 0 : b ? 1 : 3; S.sel = S.out.has(idx) || S.gone.has(idx) ? null : idx; paintTiles(); say();
}
function toggleOut(i) { if (S.done || S.gone.has(i)) return; S.out.has(i) ? S.out.delete(i) : S.out.add(i); if (S.sel === i) S.sel = null; sfx.out(); paintTiles(); say();
  live(S.out.has(i) ? `${L[i]} crossed out` : `${L[i]} back in`); }
function paintTiles() { document.querySelectorAll(".tile").forEach(t => { const i = +t.dataset.i, on = S.sel === i && !S.done;
  t.classList.toggle("sel", on); t.classList.toggle("out", S.out.has(i)); t.querySelector(".face").setAttribute("aria-checked", String(S.sel === i)); }); }
function say() { $("say").textContent = S.done ? "" : S.sel == null ? "Pick an answer" : S.shape.kind === "classic" ? `Tap ${L[S.sel]} again to answer` : `Tap ${L[S.sel]} to answer`; }
function paintTop() { $("seg").innerHTML = Array.from({ length: 9 }, (_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join(""); $("xp").textContent = xp;
  $("streak").textContent = streak >= 2 ? `${streak} in a row` : "";
  const tr = document.querySelector(".tries"), left = Math.max(0, 3 - S.tries);
  if (tr) { tr.innerHTML = [0, 1, 2].map(i => `<i class="${i >= S.tries ? "live" : ""}"></i>`).join(""); tr.setAttribute("aria-label", `${left} ${left === 1 ? "try" : "tries"} left`); } }
document.addEventListener("keydown", e => { if (!S) return; if (S.done) { if (e.key === "Enter") next(); return; }
  const i = "abcd".indexOf(e.key.toLowerCase()); if (i >= 0 && i < S.it.opts.length && !e.metaKey && !e.ctrlKey) { press(i); return; }
  const a = document.activeElement;
  if (e.key === "Enter" && S.sel != null && (a === document.body || a?.classList?.contains("face"))) { e.preventDefault(); submit(); } });

function submit() {
  const i = S.sel; if (i == null || S.done) return;
  const t = document.querySelector(`.tile[data-i="${i}"]`), ok = i === S.it.a; S.tries++; sfx.lock(); buzz(18);
  if (ok) {
    S.done = true; const gain = XP_BY_TRY[S.tries - 1]; xp += gain; streak = S.tries === 1 ? streak + 1 : 0;
    t.querySelector(".ok").textContent = (S.tries === 1 ? "First try" : "Correct") + " · +" + gain + " XP";
    t.querySelector(".why").textContent = "Why · " + (S.it.clues[0] || "");
    t.querySelector(".back").removeAttribute("aria-hidden");
    t.classList.remove("sel"); setTimeout(() => { t.classList.add("flipped"); sfx.right(); buzz([20, 40, 30]); burst(t); flyXP(t, gain); }, reduced ? 0 : 140);
    toast(S.tries === 1 ? "First try · +" + gain + " XP" : "Got it · +" + gain + " XP", "ok");
    live(`Correct, ${L[i]}. Plus ${gain} XP. Why: ${S.it.clues[0] || ""}`);
    $("next").classList.add("show"); setHint(null);
  } else {
    streak = 0; S.sel = null; S.gone.add(i); S.out.delete(i);
    const clue = S.it.clues[Math.min(S.tries - 1, S.it.clues.length - 1)], last = S.tries >= 3 || S.gone.size >= S.it.opts.length - 1;
    shatter(t, S.hit[i]).then(() => {
      if (last) { S.done = true; const r = document.querySelector(`.tile[data-i="${S.it.a}"]`);
        r.querySelector(".ok").textContent = "The answer"; r.querySelector(".why").textContent = "Why · " + (S.it.clues[0] || ""); r.querySelector(".back").removeAttribute("aria-hidden");
        r.classList.add("flipped"); $("next").classList.add("show"); setHint(null); }
      const first = [...document.querySelectorAll(".tile")].find(x => !S.gone.has(+x.dataset.i) && !S.out.has(+x.dataset.i));
      if (first && !last) first.querySelector(".face").focus({ preventScroll: true });
      paintTiles(); say(); });
    if (last) toast("Answer: " + L[S.it.a], "no");
    else { toast("Not that one · " + (3 - S.tries) + " left", "no"); setHint(clue); }
    live(`${L[i]} is wrong and removed. ${last ? "The answer is " + L[S.it.a] + "." : (3 - S.tries) + (3 - S.tries === 1 ? " try" : " tries") + " left. A hint is ready."}`);

}

// The glass breaks: a spider-web of cracks from where it was tapped, then shards along those cracks fly, spin and fall;
// the card is taken out and the others close the gap. Shards carry their own piece of the text (a clipped copy).
function shatter(tile, hit) {
  const face = tile.querySelector(".face"), r = face.getBoundingClientRect(), w = r.width, h = r.height;
  const p = hit && hit.x > 0 ? { x: Math.min(w - 8, Math.max(8, hit.x)), y: Math.min(h - 8, Math.max(8, hit.y)) } : { x: w * 0.5, y: h * 0.45 };
  if (reduced) { tile.style.transition = "opacity 200ms"; tile.style.opacity = "0"; return wait(220).then(() => leaveGap(tile)); }
  // Rays from the impact to the edge (jittered), and a ring of cracks around the impact.
  const N = 9, rays = [];
  for (let k = 0; k < N; k++) { const a = (k / N) * Math.PI * 2 + rnd(-0.22, 0.22), e = edge(p, a, w, h); rays.push({ a, e, ring: { x: p.x + Math.cos(a) * rnd(0.25, 0.42) * Math.hypot(e.x - p.x, e.y - p.y), y: p.y + Math.sin(a) * rnd(0.25, 0.42) * Math.hypot(e.x - p.x, e.y - p.y) } }); }
  rays.sort((u, v) => u.a - v.a);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "cracks"); svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const jag = (a, b) => { const m = 3, pts = [a]; for (let s = 1; s < m; s++) { const t = s / m; pts.push({ x: a.x + (b.x - a.x) * t + rnd(-4, 4), y: a.y + (b.y - a.y) * t + rnd(-4, 4) }); } pts.push(b); return pts; };
  const paths = rays.map(ry => jag(p, ry.e)).concat([rays.map(ry => ry.ring).concat([rays[0].ring])]);
  const fine = rays.map(ry => { const m = { x: (ry.ring.x + ry.e.x) / 2, y: (ry.ring.y + ry.e.y) / 2 }, a = ry.a + rnd(0.5, 0.9) * (Math.random() < 0.5 ? -1 : 1), l = rnd(10, 26);
    return [m, { x: m.x + Math.cos(a) * l, y: m.y + Math.sin(a) * l }]; });
  paths.concat(fine).forEach((pts, n) => { const d = document.createElementNS(svg.namespaceURI, "path"); if (n >= paths.length) d.setAttribute("class", "fine"); d.setAttribute("d", "M" + pts.map(q => q.x.toFixed(1) + " " + q.y.toFixed(1)).join(" L"));
    const len = pts.reduce((s, q, k) => k ? s + Math.hypot(q.x - pts[k - 1].x, q.y - pts[k - 1].y) : 0, 0); d.style.strokeDasharray = len; d.style.strokeDashoffset = len; svg.appendChild(d);
    d.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 220, easing: "ease-out", fill: "forwards" }); });
  face.appendChild(svg); sfx.crack(); buzz(12);
  const fl = document.createElement("div"); fl.className = "impact"; fl.style.left = p.x + "px"; fl.style.top = p.y + "px"; face.appendChild(fl);
  fl.animate([{ opacity: 0, transform: "scale(0.3)" }, { opacity: 1, transform: "scale(1)", offset: 0.25 }, { opacity: 0, transform: "scale(1.4)" }], { duration: 300, easing: "ease-out", fill: "forwards" });
  tile.animate([{ transform: "translateX(0)" }, { transform: "translateX(-5px) rotate(-0.6deg)" }, { transform: "translateX(4px) rotate(0.5deg)" }, { transform: "translateX(0)" }], { duration: 200 });
  return wait(380).then(() => {                                                  // a beat to see the crack before it breaks
    // Shards: an inner wedge (impact to ring) and an outer piece (ring to edge, with any card corner in between).
    const corners = [{ x: 0, y: 0 }, { x: w, y: 0 }, { x: w, y: h }, { x: 0, y: h }].map(c => ({ ...c, a: norm(Math.atan2(c.y - p.y, c.x - p.x)) }));
    const polys = [];
    for (let k = 0; k < N; k++) { const A = rays[k], B = rays[(k + 1) % N], a0 = norm(A.a), a1 = norm(B.a);
      const between = corners.filter(c => a1 > a0 ? c.a > a0 && c.a < a1 : c.a > a0 || c.a < a1).sort((u, v) => ((u.a - a0 + 2 * Math.PI) % (2 * Math.PI)) - ((v.a - a0 + 2 * Math.PI) % (2 * Math.PI)));
      polys.push([p, A.ring, B.ring]); polys.push([A.ring, A.e, ...between, B.e, B.ring]); }
    const layer = $("shards"); face.style.visibility = "hidden"; tile.querySelector(".x").style.visibility = "hidden"; sfx.shatter(); buzz([30, 30, 50]);
    const anims = polys.map(poly => {
      const s = face.cloneNode(true); s.removeAttribute("role"); s.className = "shard"; s.querySelector(".cracks")?.remove(); s.style.visibility = "visible";
      Object.assign(s.style, { left: r.left + "px", top: r.top + "px", width: w + "px", height: h + "px", display: "flex", gap: "12px", padding: "16px 16px 16px 14px",
        clipPath: "polygon(" + poly.map(q => (q.x / w * 100).toFixed(2) + "% " + (q.y / h * 100).toFixed(2) + "%").join(",") + ")" });
      layer.appendChild(s);
      const c = poly.reduce((m, q) => ({ x: m.x + q.x / poly.length, y: m.y + q.y / poly.length }), { x: 0, y: 0 });

      return s.animate([
        { transform: "translate3d(0,0,0) rotate(0deg)", opacity: 1, transformOrigin: `${c.x}px ${c.y}px` },
        { transform: `translate3d(${ox * 0.55}px, ${oy * 0.55 - 12}px, 40px) rotateX(${rx * 0.3}deg) rotateY(${ry * 0.3}deg) rotate(${rz * 0.3}deg)`, opacity: 1, offset: 0.25, transformOrigin: `${c.x}px ${c.y}px` },
        { transform: `translate3d(${ox}px, ${oy + fall}px, 0) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${rz}deg)`, opacity: 0, transformOrigin: `${c.x}px ${c.y}px` }],
        { duration: rnd(720, 980), easing: "cubic-bezier(.25,.6,.45,1)", fill: "forwards" }).finished.then(() => s.remove());
    });

}
function leaveGap(tile) { // the broken card keeps its slot, empty: the others stay where the learner last saw them

}
const norm = a => (a + 2 * Math.PI) % (2 * Math.PI), wait = ms => new Promise(r => setTimeout(r, ms));
function edge(p, a, w, h) { const cx = Math.cos(a), cy = Math.sin(a); let t = Infinity;
  if (cx > 1e-6) t = Math.min(t, (w - p.x) / cx); if (cx < -1e-6) t = Math.min(t, -p.x / cx); if (cy > 1e-6) t = Math.min(t, (h - p.y) / cy); if (cy < -1e-6) t = Math.min(t, -p.y / cy);
  return { x: p.x + cx * t, y: p.y + cy * t }; }

function next() { const order = ["1.1.1", "1.1.5", "1.3.1"]; load(order[(order.indexOf(S.it.n) + 1) % order.length]); }
$("next").onclick = next;
// The hint: after a miss a small Hint button appears (with a nudge); the clue shows only when the learner asks for it.
function setHint(text) { const h = $("hint"), c = $("clue"); c.classList.remove("show"); h.setAttribute("aria-expanded", "false"); h.classList.remove("new");
  if (!text) { h.classList.remove("show"); return; }
  c.textContent = text; h.classList.add("show"); void h.offsetWidth; h.classList.add("new"); }
$("hint").onclick = () => { const h = $("hint"), open = !$("clue").classList.contains("show");
  $("clue").classList.toggle("show", open); h.setAttribute("aria-expanded", String(open)); h.classList.remove("new"); sfx.pick(); if (open) live("Hint: " + $("clue").textContent); };
function toast(t, k) { const e = $("toast"); e.textContent = t; e.className = "toast show " + k; clearTimeout(e._t); e._t = setTimeout(() => e.className = "toast " + k, 1500); }
function swipeOut(t, i) { let y0 = null; t.addEventListener("touchstart", e => y0 = e.touches[0].clientY, { passive: true });
  t.addEventListener("touchend", e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 60) toggleOut(i); y0 = null; }); }

const fx = $("fx"), cx = fx.getContext("2d"); let parts = [];
function size() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); } size(); addEventListener("resize", size);
function burst(t) { if (reduced) return; const r = t.getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height / 2, start = !parts.length;
  for (let k = 0; k < 46; k++) { const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5; parts.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, c: ["#f5c451", "#00b5ff", "#8911ff", "#ffffff"][k % 4] }); }
  if (start) requestAnimationFrame(loop); }
function loop() { cx.clearRect(0, 0, innerWidth, innerHeight); parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= 0.018; cx.globalAlpha = Math.max(0, p.life); cx.fillStyle = p.c; cx.fillRect(p.x, p.y, 4, 4); });
  parts = parts.filter(p => p.life > 0); cx.globalAlpha = 1; if (parts.length) requestAnimationFrame(loop); }
function flyXP(t, gain) { if (!gain) return; const r = t.getBoundingClientRect(), to = $("xp").getBoundingClientRect(), e = document.createElement("div"); e.className = "fly"; e.textContent = "+" + gain;
  e.style.left = (r.left + r.width / 2) + "px"; e.style.top = (r.top) + "px"; document.body.appendChild(e);
  requestAnimationFrame(() => { e.style.transform = `translate(${to.left - r.left - r.width / 2}px, ${to.top - r.top}px) scale(0.7)`; e.style.opacity = "0.2"; });
  setTimeout(() => e.remove(), 950); }

document.querySelectorAll(".pick button").forEach(b => b.onclick = () => load(b.dataset.q));
load("1.1.1");
</script>
